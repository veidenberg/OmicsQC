services:
  omicsqc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certh-cvdlink-omicsqc-integration-test
    restart: unless-stopped
    expose:
      - "3838"
    environment:
      OMICSQC_AUTH_URL: ${OMICSQC_AUTH_URL:-http://certh-cvdlink-express-back-integration-test:14201/api/v1/auth/me}
      TMPDIR: /tmp/omicsqc
    tmpfs:
      - /tmp/omicsqc:size=4g,mode=1777
    networks:
      - certh-cvdlink-test-net

networks:
  certh-cvdlink-test-net:
    external: true
